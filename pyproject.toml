[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexmate-writing"
version = "0.3.0"
description = "WriteUrRobo: DexMate and G1 ASCII contact-writing simulation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [{name = "Xiangchen Liu"}]
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "mujoco==3.10.0", "imageio>=2.37,<3", "imageio-ffmpeg>=0.6,<1", "Pillow>=11,<13", "Hershey-Fonts==2.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11", "build>=1.2"]

[project.scripts]
g1-fetch-writing-model = "dexmate_writing.g1.fetch:main"
g1-contact-write = "dexmate_writing.g1.write:main"
g1-render-writing = "dexmate_writing.g1.render:main"
dexmate-contact-write = "dexmate_writing.contact.cli:main"
dexmate-fetch-contact-station = "dexmate_writing.contact.fetch_station:main"
dexmate-writing = "dexmate_writing.cli:main"
dexmate-fetch-model = "dexmate_writing.fetch_model:main"

[project.urls]
Repository = "https://github.com/MrAmazing-h/WriteUrRobo"
Issues = "https://github.com/MrAmazing-h/WriteUrRobo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dexmate_writing" = ["data/strokes/*", "data/*.json"]
"dexmate_writing.g1" = ["data/*.xml", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
