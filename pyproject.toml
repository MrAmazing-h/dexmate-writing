[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexmate-writing"
version = "0.1.0"
description = "DexMate Writing: Vega-1P/F5D6 kinematic motion generation and evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Xiangchen Liu"}]
dependencies = ["numpy>=2.2,<3", "scipy>=1.15,<2", "mujoco==3.10.0", "imageio>=2.37,<3", "imageio-ffmpeg>=0.6,<1", "Pillow>=11,<13"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11", "build>=1.2"]

[project.scripts]
dexmate-writing = "dexmate_writing.cli:main"
dexmate-fetch-model = "dexmate_writing.fetch_model:main"

[project.urls]
Repository = "https://github.com/MrAmazing-h/dexmate-writing"
Issues = "https://github.com/MrAmazing-h/dexmate-writing/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dexmate_writing" = ["data/strokes/*", "data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
